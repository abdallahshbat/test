<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لوحة الطالب - حفّاظ</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',Tahoma,sans-serif;background:#f5f0eb;color:#1a202c;min-height:100vh;direction:rtl}
:root{--primary:#2c3e50;--green:#27ae60;--gold:#f39c12;--red:#e74c3c;--bg:#f5f0eb;--card:#fff;--border:#e2d9d0;--radius:14px;--shadow:0 2px 10px rgba(0,0,0,.08);--muted:#8a8a8a}
.topbar{position:fixed;top:0;right:0;left:0;height:56px;background:var(--primary);color:#fff;display:flex;align-items:center;padding:0 16px;z-index:100;gap:10px}
.topbar .logo{font-size:1.1rem;font-weight:800;flex:1}
.topbar .student-name{font-size:.8rem;opacity:.8;max-width:130px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.topbar .profile-btn{color:#fff;text-decoration:none;font-size:1.25rem;line-height:1;padding:4px 6px;border-radius:8px;background:rgba(255,255,255,.12);transition:background .2s}
.topbar .profile-btn:hover{background:rgba(255,255,255,.25)}
.bottom-nav{position:fixed;bottom:0;right:0;left:0;height:62px;background:#fff;border-top:1px solid var(--border);display:flex;z-index:100}
.nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border:none;background:none;cursor:pointer;color:var(--muted);font-family:inherit;font-size:.65rem;padding:6px 4px}
.nav-btn.active{color:var(--primary)}
.nav-btn svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.main{margin-top:56px;margin-bottom:70px;padding:14px}
.view{display:none}.view.active{display:block}
.card{background:var(--card);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);margin-bottom:14px}
.card-title{font-size:.95rem;font-weight:700;color:var(--primary);margin-bottom:12px;display:flex;align-items:center;gap:8px}
.card-title .icon{font-size:1.1rem}
.grad-banner{background:linear-gradient(135deg,#2c3e50,#2980b9);color:#fff;border-radius:var(--radius);padding:18px;margin-bottom:14px;text-align:center}
.grad-banner .glabel{font-size:.82rem;opacity:.8;margin-bottom:4px}
.grad-banner .gdate{font-size:1.4rem;font-weight:800}
.grad-banner .gday{font-size:.85rem;opacity:.85;margin-top:4px}
.plan-day{border-radius:10px;border:1.5px solid var(--border);margin-bottom:10px;overflow:hidden}
.plan-day.today{border-color:#2980b9;box-shadow:0 0 0 2px rgba(41,128,185,.18)}
.plan-day-header{padding:10px 14px;display:flex;justify-content:space-between;align-items:center;background:#f8f5f2;cursor:pointer;user-select:none}
.plan-day.today .plan-day-header{background:#ebf3fb}
.plan-day-header .dlabel{font-size:.9rem;font-weight:700;color:var(--primary)}
.plan-day.today .plan-day-header .dlabel{color:#1a6ca8}
.plan-day-header .ddate{font-size:.75rem;color:var(--muted);margin-top:2px}
.today-badge{background:#2980b9;color:#fff;font-size:.63rem;font-weight:700;padding:2px 8px;border-radius:20px;margin-right:6px}
.plan-day-body{padding:10px 14px;display:none}
.plan-day.open .plan-day-body,.plan-day.today .plan-day-body{display:block}
.task-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid #f0ede8}
.task-row:last-child{border:none}
.task-icon-btn{width:42px;height:42px;border-radius:50%;border:2px solid var(--border);background:#fff;display:flex;align-items:center;justify-content:center;font-size:1.1rem;cursor:pointer;transition:all .2s;flex-shrink:0;box-shadow:0 1px 4px rgba(0,0,0,.08)}
.task-icon-btn.done{background:var(--green);border-color:var(--green)}
.task-label{flex:1;font-size:.87rem;color:#2c3e50}
.task-label.done{color:var(--muted);text-decoration:line-through}
.task-type-badge{font-size:.7rem;font-weight:700;padding:2px 8px;border-radius:12px;white-space:nowrap;flex-shrink:0}
.badge-memorize{background:#e8f4fd;color:#1a6ca8}
.badge-repeat{background:#e8fdf4;color:#1a7a45}
.badge-link{background:#fdf5e8;color:#9b6a10}
.badge-review{background:#fde8e8;color:#a82020}
.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.stat-box{background:#f8f5f2;border-radius:10px;padding:14px 10px;text-align:center;border:1px solid var(--border)}
.stat-box .snum{font-size:1.6rem;font-weight:800;color:var(--primary);line-height:1}
.stat-box .slbl{font-size:.68rem;color:var(--muted);margin-top:5px}
.progress-wrap{margin-top:4px}
.progress-label{display:flex;justify-content:space-between;font-size:.78rem;color:var(--muted);margin-bottom:5px}
.progress-track{background:#e8e2db;border-radius:20px;height:8px;overflow:hidden}
.progress-fill{height:100%;background:var(--green);border-radius:20px;transition:width .5s}
.session-row{padding:11px 0;border-bottom:1px solid var(--border)}
.session-row:last-child{border:none}
.session-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.session-date{font-size:.78rem;color:var(--muted)}
.score-badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:.78rem;font-weight:700}
.score-badge.green{background:#d5f5e3;color:#1e8449}
.score-badge.yellow{background:#fef9e7;color:#b7950b}
.score-badge.red{background:#fdecea;color:#c0392b}
.session-range{font-size:.88rem;font-weight:600;color:var(--primary)}
.session-note{font-size:.78rem;color:var(--muted);margin-top:3px}
.review-done-msg{background:#e8fdf4;border-radius:10px;padding:14px;text-align:center;color:#1a7a45;font-weight:600;font-size:.88rem;border:1px solid #b2dfc6}
.review-textarea{width:100%;padding:10px 12px;border:1.5px solid var(--border);border-radius:8px;font-size:.9rem;font-family:inherit;resize:vertical;min-height:80px;direction:rtl;outline:none}
.review-textarea:focus{border-color:var(--primary)}
.btn-primary{width:100%;padding:13px;background:var(--primary);color:#fff;border:none;border-radius:10px;font-size:.95rem;font-weight:700;cursor:pointer;font-family:inherit;margin-top:10px;transition:background .2s}
.btn-primary:hover{background:#1a252f}
.btn-primary:disabled{background:#9ca3af;cursor:not-allowed}
.btn-green{background:var(--green) !important}
.btn-green:hover{background:#1e8449 !important}
.btn-whatsapp{background:#25D366;color:#fff;border:none;border-radius:10px;padding:13px;font-size:.95rem;font-weight:700;cursor:pointer;font-family:inherit;width:100%;margin-bottom:10px;transition:background .2s;display:block}
.btn-whatsapp:hover{background:#1ebe57}
.btn-logout{background:transparent;color:var(--red);border:1.5px solid var(--red);border-radius:10px;padding:11px;font-size:.9rem;font-weight:600;cursor:pointer;font-family:inherit;width:100%;transition:all .2s;display:block}
.btn-logout:hover{background:var(--red);color:#fff}
.honor-row{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--border)}
.honor-row:last-child{border:none}
.honor-rank{font-size:1.1rem;min-width:30px;text-align:center}
.honor-name{flex:1;font-size:.9rem;font-weight:600;color:var(--primary)}
.honor-name.me{color:#1a6ca8;font-weight:800}
.honor-score{font-size:.9rem;font-weight:700;color:var(--green)}
.exam-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--border)}
.exam-row:last-child{border:none}
.exam-label{font-size:.87rem;color:var(--primary);font-weight:600}
.exam-date{font-size:.73rem;color:var(--muted);margin-top:2px}
.exam-score{font-size:.95rem;font-weight:800}
.toast-wrap{position:fixed;top:66px;left:50%;transform:translateX(-50%);z-index:9999;pointer-events:none;display:flex;flex-direction:column;gap:8px;align-items:center}
.toast{padding:10px 22px;border-radius:10px;font-size:.88rem;font-weight:600;color:#fff;box-shadow:0 4px 16px rgba(0,0,0,.15);animation:fadeUp .3s ease;white-space:nowrap}
.toast.success{background:#27ae60}.toast.error{background:#e74c3c}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.empty{text-align:center;color:var(--muted);padding:24px;font-size:.88rem}
.loading{text-align:center;color:var(--muted);padding:20px;font-size:.88rem}

/* STUDY PLAN CARDS */
.study-plan-banner{background:linear-gradient(135deg,#1a3c2e,#2d7a57);color:#fff;border-radius:var(--radius);padding:14px 18px;margin-bottom:14px;display:flex;align-items:center;justify-content:space-between}
.study-plan-banner .sp-title{font-size:.95rem;font-weight:700}
.study-plan-banner .sp-sub{font-size:.75rem;opacity:.8;margin-top:2px}
.sp-day-card{border-radius:12px;border:1.5px solid var(--border);margin-bottom:12px;overflow:hidden;background:var(--card);box-shadow:var(--shadow)}
.sp-day-card.sp-today{border-color:#2980b9;box-shadow:0 0 0 2px rgba(41,128,185,.2)}
.sp-day-header{padding:12px 16px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;background:#f8f5f2;user-select:none}
.sp-day-card.sp-today .sp-day-header{background:#ebf3fb}
.sp-day-num{font-size:.95rem;font-weight:800;color:var(--primary)}
.sp-day-card.sp-today .sp-day-num{color:#1a6ca8}
.sp-day-status{font-size:1rem}
.sp-day-body{display:none;padding:12px 16px}
.sp-day-card.sp-open .sp-day-body,.sp-day-card.sp-today .sp-day-body{display:block}
.sp-task-row{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid #f0ede8}
.sp-task-row:last-child{border:none}
.sp-checkbox{width:36px;height:36px;border-radius:50%;border:2px solid var(--border);background:#fff;display:flex;align-items:center;justify-content:center;font-size:1rem;cursor:pointer;flex-shrink:0;transition:all .2s}
.sp-checkbox.done{background:var(--green);border-color:var(--green);color:#fff}
.sp-task-label{flex:1;font-size:.86rem;color:#2c3e50}
.sp-task-label.done{text-decoration:line-through;color:var(--muted)}
.sp-task-type{font-size:.7rem;font-weight:700;padding:2px 8px;border-radius:12px;white-space:nowrap;flex-shrink:0}
.sp-type-memo{background:#e8f4fd;color:#1a6ca8}
.sp-type-link{background:#fdf5e8;color:#9b6a10}
.sp-type-review{background:#fde8e8;color:#a82020}
.sp-day-actions{margin-top:10px;display:flex;gap:8px}
.btn-sp-copy{padding:7px 14px;background:#f3f4f6;color:#2c3e50;border:1px solid var(--border);border-radius:8px;font-size:.78rem;font-weight:600;cursor:pointer;font-family:inherit}
.btn-sp-copy:hover{background:#e5e7eb}
.no-plan-msg{background:#f9fafb;border-radius:var(--radius);padding:32px;text-align:center;border:2px dashed var(--border)}
.no-plan-msg .np-icon{font-size:2.5rem;margin-bottom:10px}
.no-plan-msg p{font-size:.88rem;color:var(--muted)}
</style>
</head>
<body>

<div class="topbar">
  <span class="logo">حفّاظ</span>
  <span class="student-name" id="studentNameTop">…</span>
  <a href="../profile.html" class="profile-btn" title="الملف الشخصي">👤</a>
</div>

<nav class="bottom-nav">
  <button class="nav-btn active" id="nb-plan" onclick="showView('plan')">
    <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
    الخطة
  </button>
  <button class="nav-btn" id="nb-study" onclick="showView('study')">
    <svg viewBox="0 0 24 24"><path d="M2 3h6a4 4 0 014 4v14a3 3 0 00-3-3H2z"/><path d="M22 3h-6a4 4 0 00-4 4v14a3 3 0 013-3h7z"/></svg>
    خطتي
  </button>
  <button class="nav-btn" id="nb-achieve" onclick="showView('achieve')">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="6"/><path d="M15.477 12.89L17 22l-5-3-5 3 1.523-9.11"/></svg>
    منجزاتي
  </button>
  <button class="nav-btn" id="nb-sessions" onclick="showView('sessions')">
    <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
    الجلسات
  </button>
  <button class="nav-btn" id="nb-honor" onclick="showView('honor')">
    <svg viewBox="0 0 24 24"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
    الشرف
  </button>
</nav>

<div class="toast-wrap" id="toastWrap"></div>

<div class="main">

  <!-- PLAN VIEW -->
  <div class="view active" id="view-plan">
    <div class="grad-banner" id="gradBanner">
      <div class="glabel">موعد التخرج المتوقع</div>
      <div class="gdate" id="gradDate">—</div>
      <div class="gday" id="gradDay"></div>
    </div>
    <div class="card">
      <div class="card-title"><span class="icon">📅</span> الخطة اليومية</div>
      <div id="planList"><div class="loading">جاري التحميل…</div></div>
    </div>
    <div style="margin-bottom:14px">
      <button class="btn-whatsapp" onclick="copyToWhatsApp()">📱 نسخ إنجازات اليوم للواتساب</button>
      <button class="btn-logout" onclick="logout()">تسجيل الخروج</button>
    </div>
  </div>

  <!-- STUDY PLAN VIEW -->
  <div class="view" id="view-study">
    <div id="studyPlanContent"><div class="loading">جاري التحميل…</div></div>
  </div>

  <!-- ACHIEVE VIEW -->
  <div class="view" id="view-achieve">
    <div class="card">
      <div class="card-title"><span class="icon">🏆</span> منجزاتي</div>
      <div class="stats-grid" id="statsGrid"><div class="loading" style="grid-column:span 2">جاري التحميل…</div></div>
      <div id="progressSection" style="display:none">
        <div class="progress-label"><span>نسبة الإنجاز</span><span id="progressPct">0%</span></div>
        <div class="progress-track"><div class="progress-fill" id="progressBar" style="width:0%"></div></div>
      </div>
    </div>
    <div class="card">
      <div class="card-title"><span class="icon">📝</span> مراجعتي اليومية</div>
      <div id="reviewSection">
        <textarea class="review-textarea" id="reviewText" placeholder="سجّل مراجعتك اليومية هنا…"></textarea>
        <button class="btn-primary btn-green" id="reviewBtn" onclick="submitReview()">تسجيل المراجعة</button>
      </div>
    </div>
    <div class="card">
      <div class="card-title"><span class="icon">📋</span> الاختبارات المرحلية</div>
      <div id="examsList"><div class="loading">جاري التحميل…</div></div>
    </div>
  </div>

  <!-- SESSIONS VIEW -->
  <div class="view" id="view-sessions">
    <div class="card">
      <div class="card-title"><span class="icon">🎙️</span> سجل جلساتي مع المعلم</div>
      <div id="sessionsList"><div class="loading">جاري التحميل…</div></div>
    </div>
  </div>

  <!-- HONOR VIEW -->
  <div class="view" id="view-honor">
    <div class="card">
      <div class="card-title"><span class="icon">🌟</span> لوحة الشرف — أفضل 10 طلاب</div>
      <div id="honorList"><div class="loading">جاري التحميل…</div></div>
    </div>
  </div>

</div>

<script>
const SUPABASE_URL = 'https://aeonokdakdvqgiisfhwv.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFlb25va2Rha2R2cWdpaXNmaHd2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQzMDQ1MDUsImV4cCI6MjA5OTg4MDUwNX0.g1mtt9GZRod2V_Fbe1qXQhv7Hf_LVfx-IvItth9PCgI';

const client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
  auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true, storage: localStorage, storageKey: 'huffaz-auth' }
});

let currentUser = null;
let studentData = null;
let planData = [];
let studyPlanDays = [];
let studyPlanInfo = null;
let spChecked = {};
const todayStr = new Date().toISOString().slice(0, 10);
const WEEK_DAYS = ['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];

async function init() {
  const { data: { session } } = await client.auth.getSession();
  if (!session) { location.href = '../login.html'; return; }
  const { data: userData } = await client.from('users').select('name, role').eq('id', session.user.id).single();
  if (!userData || userData.role !== 'student') { location.href = '../login.html'; return; }
  currentUser = session.user;
  document.getElementById('studentNameTop').textContent = userData.name || session.user.email;
  await loadStudentData();
  await Promise.all([loadPlan(), loadStats(), loadSessions(), loadHonor(), loadExams(), checkDailyReview(), loadStudyPlan()]);
}

async function loadStudentData() {
  const { data } = await client.from('students')
    .select('id, memorized_hadiths, program_id, current_plan_id, programs(total_hadiths)')
    .eq('user_id', currentUser.id)
    .single();
  if (data) studentData = data;
}

/* ========== STUDY PLAN ========== */
async function loadStudyPlan() {
  const container = document.getElementById('studyPlanContent');
  if (!studentData?.current_plan_id) {
    container.innerHTML = `
      <div class="no-plan-msg">
        <div class="np-icon">📚</div>
        <p>لم يتم تعيين خطة علمية لك بعد<br>تواصل مع المشرف لتعيين خطتك</p>
      </div>`;
    return;
  }

  const [planRes, daysRes] = await Promise.all([
    client.from('study_plans').select('*').eq('id', studentData.current_plan_id).single(),
    client.from('study_plan_days').select('*').eq('plan_id', studentData.current_plan_id).order('day_number')
  ]);

  if (planRes.error || !planRes.data) {
    container.innerHTML = '<div class="empty">خطأ في تحميل الخطة</div>';
    return;
  }

  studyPlanInfo = planRes.data;
  studyPlanDays = daysRes.data || [];

  renderStudyPlan();
}

function renderStudyPlan() {
  const container = document.getElementById('studyPlanContent');
  if (!studyPlanInfo) return;

  const totalDays = studyPlanDays.length;
  const doneDays = studyPlanDays.filter(d => isSpDayDone(d)).length;

  container.innerHTML = `
    <div class="study-plan-banner">
      <div>
        <div class="sp-title">📖 ${studyPlanInfo.plan_name}</div>
        <div class="sp-sub">${studyPlanInfo.book_name}${studyPlanInfo.folder_name ? ' — ' + studyPlanInfo.folder_name : ''} &bull; ${doneDays}/${totalDays} يوم مكتمل</div>
      </div>
    </div>
    ${studyPlanDays.length ? studyPlanDays.map(d => renderSpDay(d)).join('') : '<div class="empty">لا توجد أيام في هذه الخطة</div>'}
  `;
}

function isSpDayDone(day) {
  const tasks = getSpTasks(day);
  return tasks.length > 0 && tasks.every(t => spChecked[day.id + '_' + t.key]);
}

function getSpTasks(day) {
  const tasks = [];
  if (day.memo_from || day.memo_to) tasks.push({ key: 'memo', type: 'حفظ', cls: 'sp-type-memo', label: [day.memo_from, day.memo_to].filter(Boolean).join(' — ') });
  if (day.link_from || day.link_to) tasks.push({ key: 'link', type: 'ربط', cls: 'sp-type-link', label: [day.link_from, day.link_to].filter(Boolean).join(' — ') });
  if (day.review_from || day.review_to) tasks.push({ key: 'review', type: 'مراجعة', cls: 'sp-type-review', label: [day.review_from, day.review_to].filter(Boolean).join(' — ') });
  return tasks;
}

function renderSpDay(day) {
  const tasks = getSpTasks(day);
  const allDone = isSpDayDone(day);
  const statusIcon = allDone ? '✅' : '⭕';

  const tasksHtml = tasks.map(t => {
    const done = !!spChecked[day.id + '_' + t.key];
    return `<div class="sp-task-row">
      <button class="sp-checkbox${done ? ' done' : ''}" onclick="toggleSpTask('${day.id}','${t.key}',this)">${done ? '✓' : '○'}</button>
      <span class="sp-task-type ${t.cls}">${t.type}</span>
      <span class="sp-task-label${done ? ' done' : ''}">${t.label}</span>
    </div>`;
  }).join('');

  return `<div class="sp-day-card" id="spday-${day.id}">
    <div class="sp-day-header" onclick="this.parentElement.classList.toggle('sp-open')">
      <div class="sp-day-num">اليوم ${day.day_number}</div>
      <span class="sp-day-status">${statusIcon}</span>
    </div>
    <div class="sp-day-body">
      ${tasks.length ? tasksHtml : '<div class="empty" style="padding:8px">لا توجد مهام</div>'}
      ${tasks.length ? `<div class="sp-day-actions"><button class="btn-sp-copy" onclick="copySpDay(${day.day_number},'${day.id}')">📱 نسخ للواتساب</button></div>` : ''}
    </div>
  </div>`;
}

function toggleSpTask(dayId, taskKey, btn) {
  const k = dayId + '_' + taskKey;
  spChecked[k] = !spChecked[k];
  const done = spChecked[k];
  btn.classList.toggle('done', done);
  btn.textContent = done ? '✓' : '○';
  const row = btn.closest('.sp-task-row');
  if (row) row.querySelector('.sp-task-label').classList.toggle('done', done);

  const card = document.getElementById('spday-' + dayId);
  if (card) {
    const day = studyPlanDays.find(d => d.id === dayId);
    if (day) {
      const allDone = isSpDayDone(day);
      const si = card.querySelector('.sp-day-status');
      if (si) si.textContent = allDone ? '✅' : '⭕';
    }
  }
}

function copySpDay(dayNum, dayId) {
  const day = studyPlanDays.find(d => d.id === dayId);
  if (!day) return;
  const tasks = getSpTasks(day).filter(t => spChecked[dayId + '_' + t.key]);
  if (!tasks.length) { showToast('لم تُنجز أي مهمة في هذا اليوم بعد', 'error'); return; }
  const lines = [
    `📚 *منصة حفّاظ — ${studyPlanInfo?.plan_name || 'خطتي'}*`,
    `اليوم ${dayNum}`,
    ''
  ];
  tasks.forEach(t => lines.push(`${t.type === 'حفظ' ? '📖' : t.type === 'ربط' ? '🔗' : '📚'} ${t.type}: ${t.label}`));
  lines.push('', '✅ تم بحمد الله');
  const text = lines.join('\n');
  (navigator.clipboard?.writeText(text) || Promise.reject())
    .then(() => showToast('تم النسخ ✓', 'success'))
    .catch(() => {
      const ta = document.createElement('textarea');
      ta.value = text; document.body.appendChild(ta); ta.select();
      document.execCommand('copy'); ta.remove();
      showToast('تم النسخ ✓', 'success');
    });
}

/* ========== PLAN (student_plans) ========== */
async function loadPlan() {
  if (!studentData) { document.getElementById('planList').innerHTML = '<div class="empty">لا توجد خطة</div>'; updateGradDate([]); return; }
  const { data, error } = await client.from('student_plans')
    .select('*')
    .eq('student_id', studentData.id)
    .order('plan_date', { ascending: true });
  if (error || !data || !data.length) { document.getElementById('planList').innerHTML = '<div class="empty">لا توجد خطة مضافة بعد</div>'; updateGradDate([]); return; }
  planData = data;
  renderPlan(data);
  updateGradDate(data);
}

function getTaskDefs(row) {
  return [
    { key: 'memorize', type: 'حفظ', icon: '📖', cls: 'badge-memorize', value: row.memorize_task || row.memorize || '', done: !!(row.memorize_done) },
    { key: 'repeat',   type: 'تكرار', icon: '🔄', cls: 'badge-repeat',   value: row.repeat_task   || row.repeat   || '', done: !!(row.repeat_done)   },
    { key: 'link',     type: 'ربط',   icon: '🔗', cls: 'badge-link',     value: row.link_task     || row.link     || '', done: !!(row.link_done)     },
    { key: 'review',   type: 'مراجعة',icon: '📚', cls: 'badge-review',   value: row.review_task   || row.review   || '', done: !!(row.review_done)   },
  ].filter(t => t.value);
}

function renderPlan(data) {
  const container = document.getElementById('planList');
  container.innerHTML = '';
  data.forEach(row => {
    const isToday = row.plan_date === todayStr;
    const d = new Date(row.plan_date + 'T00:00:00');
    const dayName = WEEK_DAYS[d.getDay()];
    const dateFormatted = d.toLocaleDateString('ar-SA', { month: 'short', day: 'numeric' });
    const tasks = getTaskDefs(row);
    const allDone = tasks.length > 0 && tasks.every(t => t.done);
    const statusIcon = allDone ? '✅' : (isToday ? '🔵' : '⭕');
    const div = document.createElement('div');
    div.className = 'plan-day' + (isToday ? ' today' : '');
    div.id = 'pday-' + row.id;
    div.innerHTML = `
      <div class="plan-day-header" onclick="this.parentElement.classList.toggle('open')">
        <div>
          <div class="dlabel">${dayName} — ${dateFormatted}${isToday ? ' <span class="today-badge">اليوم</span>' : ''}</div>
          <div class="ddate">${row.plan_date || ''}</div>
        </div>
        <span style="font-size:1.1rem">${statusIcon}</span>
      </div>
      <div class="plan-day-body">
        ${tasks.length ? tasks.map(t => `
          <div class="task-row" id="tr-${row.id}-${t.key}">
            <button class="task-icon-btn${t.done ? ' done' : ''}" onclick="toggleTask('${row.id}','${t.key}',this)">${t.done ? '✓' : t.icon}</button>
            <span class="task-type-badge ${t.cls}">${t.type}</span>
            <span class="task-label${t.done ? ' done' : ''}">${t.value}</span>
          </div>
        `).join('') : '<div class="empty" style="padding:10px">لا توجد مهام</div>'}
      </div>
    `;
    container.appendChild(div);
  });
}

async function toggleTask(planId, taskKey, btn) {
  const isDone = btn.classList.contains('done');
  const newVal = !isDone;
  const updateObj = {};
  updateObj[taskKey + '_done'] = newVal;
  const { error } = await client.from('student_plans').update(updateObj).eq('id', planId);
  if (error) { showToast('خطأ في الحفظ', 'error'); return; }
  btn.classList.toggle('done', newVal);
  btn.textContent = newVal ? '✓' : ({ memorize:'📖', repeat:'🔄', link:'🔗', review:'📚' }[taskKey] || '○');
  const row = btn.closest('.task-row');
  if (row) row.querySelector('.task-label').classList.toggle('done', newVal);
  const planRow = planData.find(r => String(r.id) === String(planId));
  if (planRow) planRow[taskKey + '_done'] = newVal;
  const dayEl = document.getElementById('pday-' + planId);
  if (dayEl) {
    const tasks = getTaskDefs(planRow || {});
    const allDone = tasks.length > 0 && tasks.every(t => t.done);
    const si = dayEl.querySelector('.plan-day-header span:last-child');
    if (si) si.textContent = allDone ? '✅' : (planRow?.plan_date === todayStr ? '🔵' : '⭕');
  }
  updateGradDate(planData);
  showToast(newVal ? 'تم تسجيل الإنجاز ✓' : 'تم إلغاء الإنجاز', newVal ? 'success' : 'error');
}

function updateGradDate(data) {
  let remaining = 0;
  data.forEach(row => {
    const tasks = getTaskDefs(row);
    if (tasks.length > 0 && !tasks.every(t => t.done)) remaining++;
  });
  const grad = new Date();
  grad.setDate(grad.getDate() + remaining);
  const gradDateStr = grad.toLocaleDateString('ar-SA', { year: 'numeric', month: 'long', day: 'numeric' });
  const gradDayStr = WEEK_DAYS[grad.getDay()];
  document.getElementById('gradDate').textContent = gradDateStr;
  document.getElementById('gradDay').textContent = gradDayStr + (remaining > 0 ? ' — بعد ' + remaining + ' يوم' : ' — اليوم!');
}

/* ========== STATS ========== */
async function loadStats() {
  const grid = document.getElementById('statsGrid');
  if (!studentData) { grid.innerHTML = '<div class="empty" style="grid-column:span 2">لا توجد بيانات</div>'; return; }
  const { data: sessions } = await client.from('recitation_sessions')
    .select('hadith_to, hadith_from, score, linking_to, linking_from, date')
    .eq('student_id', studentData.id)
    .order('date', { ascending: false });
  const arr = sessions || [];
  const cnt = arr.length;
  const lastH = arr[0]?.hadith_to || 0;
  const memorized = studentData.memorized_hadiths || 0;
  const totalH = studentData.programs?.total_hadiths || 0;
  const avgScore = cnt ? (arr.reduce((s, r) => s + (parseFloat(r.score) || 0), 0) / cnt).toFixed(2) : '—';
  const totalLink = arr.reduce((s, r) => s + Math.max(0, (r.linking_to || 0) - (r.linking_from || 0) + 1), 0);
  const gap = Math.max(0, memorized - lastH);
  const pct = totalH ? Math.min(100, Math.round((lastH / totalH) * 100)) : 0;
  grid.innerHTML = `
    <div class="stat-box"><div class="snum">${lastH || '—'}</div><div class="slbl">أحاديث مسمّعة</div></div>
    <div class="stat-box"><div class="snum">${cnt}</div><div class="slbl">عدد الجلسات</div></div>
    <div class="stat-box"><div class="snum">${avgScore}</div><div class="slbl">متوسط التقييم / 10</div></div>
    <div class="stat-box"><div class="snum">${memorized}</div><div class="slbl">أحاديث محفوظة</div></div>
    <div class="stat-box"><div class="snum">${totalLink}</div><div class="slbl">صفحات الربط</div></div>
    <div class="stat-box"><div class="snum">${gap}</div><div class="slbl">فرق الحفظ والتسميع</div></div>
  `;
  if (totalH > 0) {
    document.getElementById('progressSection').style.display = 'block';
    document.getElementById('progressPct').textContent = pct + '%';
    setTimeout(() => { document.getElementById('progressBar').style.width = pct + '%'; }, 100);
  }
}

/* ========== DAILY REVIEW ========== */
async function checkDailyReview() {
  if (!studentData) return;
  const { data } = await client.from('daily_reviews')
    .select('id, teacher_logged, review_text')
    .eq('student_id', studentData.id)
    .eq('review_date', todayStr)
    .single();
  if (data) {
    if (data.teacher_logged) {
      document.getElementById('reviewSection').innerHTML = '<div class="review-done-msg">✅ تم تسجيل مراجعة اليوم من قِبل المعلم</div>';
    } else if (data.review_text) {
      document.getElementById('reviewText').value = data.review_text;
      document.getElementById('reviewBtn').textContent = 'تحديث المراجعة';
    }
  }
}

async function submitReview() {
  if (!studentData) return;
  const text = document.getElementById('reviewText').value.trim();
  if (!text) { showToast('اكتب مراجعتك أولاً', 'error'); return; }
  const btn = document.getElementById('reviewBtn');
  btn.disabled = true; btn.textContent = 'جاري الحفظ…';
  const { error } = await client.from('daily_reviews').upsert(
    { student_id: studentData.id, review_date: todayStr, review_text: text, teacher_logged: false },
    { onConflict: 'student_id,review_date' }
  );
  btn.disabled = false; btn.textContent = 'تحديث المراجعة';
  if (error) { showToast('خطأ: ' + error.message, 'error'); return; }
  showToast('تم تسجيل المراجعة ✓', 'success');
}

/* ========== SESSIONS ========== */
async function loadSessions() {
  const list = document.getElementById('sessionsList');
  if (!studentData) { list.innerHTML = '<div class="empty">لا توجد بيانات</div>'; return; }
  const { data, error } = await client.from('recitation_sessions')
    .select('id, date, hadith_from, hadith_to, score, notes')
    .eq('student_id', studentData.id)
    .order('date', { ascending: false });
  if (error || !data || !data.length) { list.innerHTML = '<div class="empty">لا توجد جلسات بعد</div>'; return; }
  list.innerHTML = data.map(s => {
    const score = parseFloat(s.score);
    const cls = score >= 8.5 ? 'green' : score >= 7 ? 'yellow' : 'red';
    return `<div class="session-row">
      <div class="session-top">
        <span class="session-date">${s.date || '—'}</span>
        <span class="score-badge ${cls}">${isNaN(score) ? '—' : score.toFixed(2)}/10</span>
      </div>
      <div class="session-range">الأحاديث ${s.hadith_from || '—'} – ${s.hadith_to || '—'}</div>
      ${s.notes ? `<div class="session-note">${s.notes}</div>` : ''}
    </div>`;
  }).join('');
}

/* ========== EXAMS ========== */
async function loadExams() {
  const list = document.getElementById('examsList');
  if (!studentData) { list.innerHTML = '<div class="empty">لا توجد بيانات</div>'; return; }
  const { data, error } = await client.from('periodic_exams')
    .select('*')
    .eq('student_id', studentData.id)
    .order('exam_date', { ascending: false });
  if (error || !data || !data.length) { list.innerHTML = '<div class="empty">لا توجد اختبارات بعد</div>'; return; }
  list.innerHTML = data.map(e => {
    const score = parseFloat(e.score);
    const color = score >= 8.5 ? '#27ae60' : score >= 7 ? '#e67e22' : '#e74c3c';
    return `<div class="exam-row">
      <div>
        <div class="exam-label">${e.title || e.exam_type || 'اختبار'}</div>
        <div class="exam-date">${e.exam_date || ''}</div>
      </div>
      <div class="exam-score" style="color:${color}">${isNaN(score) ? '—' : score.toFixed(2)}/10</div>
    </div>`;
  }).join('');
}

/* ========== HONOR BOARD ========== */
async function loadHonor() {
  const list = document.getElementById('honorList');
  const { data, error } = await client.from('recitation_sessions')
    .select('student_id, score, students(users(name))');
  if (error || !data || !data.length) { list.innerHTML = '<div class="empty">لا توجد بيانات</div>'; return; }
  const map = {};
  data.forEach(r => {
    const id = r.student_id;
    if (!map[id]) map[id] = { name: r.students?.users?.name || 'طالب', scores: [] };
    const s = parseFloat(r.score);
    if (!isNaN(s)) map[id].scores.push(s);
  });
  const ranked = Object.entries(map)
    .filter(([, v]) => v.scores.length)
    .map(([id, v]) => ({ id, name: v.name, avg: v.scores.reduce((a, b) => a + b, 0) / v.scores.length }))
    .sort((a, b) => b.avg - a.avg)
    .slice(0, 10);
  const medals = ['🥇','🥈','🥉'];
  const myStudentId = studentData?.id;
  list.innerHTML = ranked.map((s, i) => {
    const isMe = String(s.id) === String(myStudentId);
    return `<div class="honor-row"${isMe ? ' style="background:#ebf3fb;border-radius:8px;padding:11px 8px"' : ''}>
      <span class="honor-rank">${medals[i] || (i + 1)}</span>
      <span class="honor-name${isMe ? ' me' : ''}">${s.name}${isMe ? ' (أنت)' : ''}</span>
      <span class="honor-score">${s.avg.toFixed(2)}</span>
    </div>`;
  }).join('');
}

/* ========== WHATSAPP ========== */
function copyToWhatsApp() {
  const todayRow = planData.find(r => r.plan_date === todayStr);
  if (!todayRow) { showToast('لا توجد خطة لليوم', 'error'); return; }
  const tasks = getTaskDefs(todayRow).filter(t => t.done);
  if (!tasks.length) { showToast('لم تنجز أي واجب اليوم بعد', 'error'); return; }
  const d = new Date(todayStr + 'T00:00:00');
  const dayName = WEEK_DAYS[d.getDay()];
  const dateFormatted = d.toLocaleDateString('ar-SA', { year: 'numeric', month: 'long', day: 'numeric' });
  const lines = ['📚 *منصة حفّاظ*', `${dayName} — ${dateFormatted}`, ''];
  tasks.forEach(t => lines.push(`${t.icon} ${t.type}: ${t.value}`));
  lines.push('', '✅ تم الإنجاز بحمد الله');
  const text = lines.join('\n');
  (navigator.clipboard?.writeText(text) || Promise.reject()).then(() => {
    showToast('تم النسخ — الصق في الواتساب ✓', 'success');
  }).catch(() => {
    const ta = document.createElement('textarea');
    ta.value = text; document.body.appendChild(ta); ta.select();
    document.execCommand('copy'); ta.remove();
    showToast('تم النسخ ✓', 'success');
  });
}

/* ========== NAV ========== */
function showView(name) {
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('view-' + name).classList.add('active');
  const nb = document.getElementById('nb-' + name);
  if (nb) nb.classList.add('active');
}

/* ========== LOGOUT ========== */
async function logout() {
  await client.auth.signOut();
  sessionStorage.removeItem('huffaz-auth');
  location.href = '../login.html';
}

/* ========== TOAST ========== */
function showToast(msg, type) {
  const w = document.getElementById('toastWrap');
  const t = document.createElement('div');
  t.className = 'toast ' + (type || 'success');
  t.textContent = msg;
  w.appendChild(t);
  setTimeout(() => t.remove(), 3000);
}

init();
