<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>لوحة الطالب — حفّاظ</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
/* ── RESET & BASE ─────────────────────────────────── */
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{font-family:'Segoe UI',system-ui,Tahoma,sans-serif;background:#F7F8FA;color:#1C2B3A;min-height:100vh;direction:rtl;-webkit-font-smoothing:antialiased}

/* ── DESIGN TOKENS ────────────────────────────────── */
:root{
  --gold:#C9A84C;
  --gold-light:#F5EDD6;
  --gold-dark:#A8872E;
  --green:#4CAF7D;
  --green-light:#E8F7EF;
  --green-dark:#2E8A57;
  --red:#E05555;
  --red-light:#FDEAEA;
  --blue:#3B82F6;
  --blue-light:#EFF6FF;
  --bg:#F7F8FA;
  --surface:#FFFFFF;
  --surface2:#F2F4F7;
  --border:#E8ECF0;
  --text-primary:#1C2B3A;
  --text-secondary:#4B5E6D;
  --text-muted:#8FA0AE;
  --radius-sm:8px;
  --radius:14px;
  --radius-lg:20px;
  --shadow-sm:0 1px 4px rgba(28,43,58,.06);
  --shadow:0 4px 16px rgba(28,43,58,.08);
  --shadow-lg:0 8px 32px rgba(28,43,58,.12);
  --topbar-h:60px;
  --nav-h:68px;
}

/* ── TOPBAR ───────────────────────────────────────── */
.topbar{
  position:fixed;top:0;right:0;left:0;height:var(--topbar-h);
  background:linear-gradient(135deg,#1C2B3A 0%,#263647 100%);
  display:flex;align-items:center;padding:0 16px;z-index:200;
  gap:10px;box-shadow:0 2px 12px rgba(0,0,0,.2);
}
.topbar-logo{
  font-size:1.15rem;font-weight:900;letter-spacing:-.02em;
  background:linear-gradient(135deg,var(--gold) 0%,#F0D080 100%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
}
.topbar-name{
  flex:1;font-size:.78rem;color:rgba(255,255,255,.7);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.topbar-profile{
  display:flex;align-items:center;justify-content:center;
  width:34px;height:34px;border-radius:50%;
  background:rgba(201,168,76,.2);border:1.5px solid rgba(201,168,76,.4);
  color:#fff;text-decoration:none;font-size:1rem;transition:.2s;
}
.topbar-profile:hover{background:rgba(201,168,76,.35)}
.topbar-logout{
  display:flex;align-items:center;gap:5px;
  padding:6px 12px;border-radius:var(--radius-sm);
  background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.15);
  color:rgba(255,255,255,.85);font-size:.75rem;font-weight:600;
  cursor:pointer;font-family:inherit;transition:.2s;
}
.topbar-logout:hover{background:rgba(224,85,85,.4);border-color:rgba(224,85,85,.5)}

/* ── BOTTOM NAV ───────────────────────────────────── */
.bottom-nav{
  position:fixed;bottom:0;right:0;left:0;height:var(--nav-h);
  background:var(--surface);border-top:1px solid var(--border);
  display:flex;z-index:200;
  padding-bottom:env(safe-area-inset-bottom,0);
  box-shadow:0 -4px 20px rgba(28,43,58,.06);
}
.nav-btn{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:4px;border:none;background:none;cursor:pointer;
  color:var(--text-muted);font-family:inherit;font-size:.6rem;font-weight:600;
  padding:6px 2px;transition:color .2s;position:relative;letter-spacing:.01em;
}
.nav-btn svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:.2s}
.nav-btn.active{color:var(--gold-dark)}
.nav-btn.active svg{stroke:var(--gold)}
.nav-btn.active::before{
  content:'';position:absolute;top:0;right:20%;left:20%;height:3px;
  background:linear-gradient(90deg,var(--gold),var(--gold-dark));
  border-radius:0 0 4px 4px;
}

/* ── MAIN LAYOUT ──────────────────────────────────── */
.main{
  margin-top:var(--topbar-h);margin-bottom:calc(var(--nav-h) + 12px);
  padding:16px;max-width:680px;margin-left:auto;margin-right:auto;
}
.view{display:none}.view.active{display:block}

/* ── CARDS ────────────────────────────────────────── */
.card{
  background:var(--surface);border-radius:var(--radius);
  padding:18px;box-shadow:var(--shadow);margin-bottom:14px;
  border:1px solid var(--border);
}
.card-header{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.card-icon{
  width:36px;height:36px;border-radius:10px;
  display:flex;align-items:center;justify-content:center;font-size:1rem;flex-shrink:0;
}
.card-icon.gold{background:var(--gold-light)}
.card-icon.green{background:var(--green-light)}
.card-icon.blue{background:var(--blue-light)}
.card-title{font-size:.95rem;font-weight:800;color:var(--text-primary)}
.card-sub{font-size:.75rem;color:var(--text-muted);margin-top:1px}

/* ── GRAD BANNER ──────────────────────────────────── */
.grad-banner{
  background:linear-gradient(135deg,#1C2B3A 0%,#2C4A5E 60%,#1a3c55 100%);
  border-radius:var(--radius-lg);padding:22px 20px;margin-bottom:14px;
  position:relative;overflow:hidden;
}
.grad-banner::before{
  content:'';position:absolute;top:-30px;left:-30px;
  width:120px;height:120px;border-radius:50%;
  background:radial-gradient(circle,rgba(201,168,76,.25) 0%,transparent 70%);
}
.grad-banner::after{
  content:'🎓';position:absolute;left:16px;top:50%;transform:translateY(-50%);
  font-size:2.2rem;opacity:.25;
}
.grad-label{font-size:.72rem;color:rgba(255,255,255,.6);margin-bottom:4px;letter-spacing:.04em;text-transform:uppercase}
.grad-date{font-size:1.5rem;font-weight:900;color:#fff;line-height:1.1}
.grad-day{
  font-size:.82rem;color:rgba(255,255,255,.75);margin-top:6px;
  display:inline-flex;align-items:center;gap:6px;
}
.grad-day::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--gold);display:inline-block}

/* ── PLAN PROGRESS CARD ───────────────────────────── */
.plan-progress-header{
  display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;
}
.plan-progress-label{font-size:.8rem;color:var(--text-secondary)}
.plan-progress-pct{
  font-size:1.4rem;font-weight:900;
  background:linear-gradient(135deg,var(--green),var(--green-dark));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
}
.progress-track{background:var(--surface2);border-radius:20px;height:10px;overflow:hidden;border:1px solid var(--border)}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--green) 0%,var(--green-dark) 100%);border-radius:20px;transition:width .6s ease}
.progress-footnote{display:flex;justify-content:space-between;font-size:.68rem;color:var(--text-muted);margin-top:6px}

/* ── STATS GRID ───────────────────────────────────── */
.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.stat-box{
  background:var(--surface2);border-radius:var(--radius);
  padding:14px 12px;text-align:center;border:1px solid var(--border);
  transition:transform .15s;
}
.stat-box:active{transform:scale(.97)}
.stat-num{font-size:1.7rem;font-weight:900;color:var(--text-primary);line-height:1}
.stat-lbl{font-size:.65rem;color:var(--text-muted);margin-top:5px;font-weight:600;letter-spacing:.02em}

/* ── ACHIEVEMENT PROGRESS BAR ─────────────────────── */
#progressSection{margin-top:4px}
.prog-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.prog-lbl{font-size:.78rem;color:var(--text-secondary);font-weight:600}
.prog-pct{font-size:.9rem;font-weight:800;color:var(--green-dark)}

/* ── STUDY PLAN BANNER ────────────────────────────── */
.sp-banner{
  background:linear-gradient(135deg,#1a3c2e 0%,#2d7a57 100%);
  border-radius:var(--radius);padding:16px 18px;margin-bottom:14px;
  display:flex;align-items:center;gap:12px;
}
.sp-banner-icon{font-size:1.6rem;flex-shrink:0}
.sp-banner-title{font-size:.95rem;font-weight:800;color:#fff}
.sp-banner-sub{font-size:.72rem;color:rgba(255,255,255,.7);margin-top:3px}

/* ── STUDY PLAN DAYS ──────────────────────────────── */
.sp-day-card{
  border-radius:var(--radius);border:1.5px solid var(--border);
  margin-bottom:10px;overflow:hidden;background:var(--surface);
  box-shadow:var(--shadow-sm);transition:box-shadow .2s;
}
.sp-day-card:hover{box-shadow:var(--shadow)}
.sp-day-card.sp-today{border-color:var(--gold);box-shadow:0 0 0 3px rgba(201,168,76,.15)}
.sp-day-card.sp-done{border-color:var(--green);opacity:.8}
.sp-day-header{
  padding:13px 16px;display:flex;justify-content:space-between;align-items:center;
  cursor:pointer;background:var(--surface2);user-select:none;
  border-bottom:1px solid transparent;transition:background .15s;
}
.sp-day-card.sp-today .sp-day-header{background:var(--gold-light)}
.sp-day-card.sp-open .sp-day-header,.sp-day-card.sp-today .sp-day-header{border-bottom-color:var(--border)}
.sp-day-header:active{background:#E8ECF0}
.sp-day-num{font-size:.88rem;font-weight:800;color:var(--text-primary)}
.sp-day-card.sp-today .sp-day-num{color:var(--gold-dark)}
.sp-today-chip{
  font-size:.62rem;font-weight:700;padding:2px 8px;border-radius:20px;
  background:var(--gold);color:#fff;margin-right:6px;
}
.sp-day-status{font-size:1.05rem}
.sp-day-body{display:none;padding:12px 16px}
.sp-day-card.sp-open .sp-day-body,.sp-day-card.sp-today .sp-day-body{display:block}
.sp-task-row{
  display:flex;align-items:center;gap:10px;
  padding:9px 0;border-bottom:1px solid var(--border);
}
.sp-task-row:last-of-type{border:none}
.sp-checkbox{
  width:38px;height:38px;border-radius:50%;
  border:2px solid var(--border);background:var(--surface);
  display:flex;align-items:center;justify-content:center;font-size:1rem;
  cursor:pointer;flex-shrink:0;transition:all .2s;box-shadow:var(--shadow-sm);
}
.sp-checkbox.done{background:var(--green);border-color:var(--green-dark);color:#fff;box-shadow:0 2px 8px rgba(76,175,125,.3)}
.sp-task-type{font-size:.68rem;font-weight:700;padding:3px 9px;border-radius:20px;white-space:nowrap;flex-shrink:0;letter-spacing:.02em}
.sp-type-memo{background:var(--blue-light);color:#1D5FA6}
.sp-type-link{background:var(--gold-light);color:var(--gold-dark)}
.sp-type-review{background:var(--red-light);color:#B03030}
.sp-task-label{flex:1;font-size:.85rem;color:var(--text-secondary);line-height:1.4}
.sp-task-label.done{text-decoration:line-through;color:var(--text-muted)}
.sp-day-actions{margin-top:10px;display:flex;gap:8px;padding-top:10px;border-top:1px solid var(--border)}
.btn-sp-copy{
  display:inline-flex;align-items:center;gap:5px;
  padding:7px 14px;background:var(--surface2);color:var(--text-secondary);
  border:1px solid var(--border);border-radius:var(--radius-sm);
  font-size:.75rem;font-weight:600;cursor:pointer;font-family:inherit;
  transition:.15s;
}
.btn-sp-copy:hover{background:var(--border);color:var(--text-primary)}

/* ── NO PLAN MESSAGE ──────────────────────────────── */
.no-plan-msg{
  background:var(--surface);border-radius:var(--radius-lg);
  padding:40px 24px;text-align:center;border:2px dashed var(--border);
}
.no-plan-icon{font-size:3rem;margin-bottom:12px;display:block}
.no-plan-title{font-size:.95rem;font-weight:700;color:var(--text-primary);margin-bottom:6px}
.no-plan-sub{font-size:.82rem;color:var(--text-muted);line-height:1.6}

/* ── SESSION ROWS ─────────────────────────────────── */
.session-row{padding:12px 0;border-bottom:1px solid var(--border)}
.session-row:last-child{border:none}
.session-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:5px}
.session-date{font-size:.75rem;color:var(--text-muted);font-weight:600}
.score-badge{display:inline-flex;align-items:center;padding:3px 11px;border-radius:20px;font-size:.75rem;font-weight:800;gap:3px}
.score-badge.green{background:var(--green-light);color:var(--green-dark)}
.score-badge.yellow{background:#FFF8E6;color:#92640A}
.score-badge.red{background:var(--red-light);color:#B03030}
.session-range{font-size:.88rem;font-weight:700;color:var(--text-primary)}
.session-note{font-size:.78rem;color:var(--text-muted);margin-top:4px;line-height:1.5}

/* ── EXAM ROWS ────────────────────────────────────── */
.exam-row{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-bottom:1px solid var(--border)}
.exam-row:last-child{border:none}
.exam-label{font-size:.87rem;color:var(--text-primary);font-weight:700}
.exam-date{font-size:.7rem;color:var(--text-muted);margin-top:3px}
.exam-score{font-size:1rem;font-weight:900}

/* ── HONOR BOARD ──────────────────────────────────── */
.honor-row{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--border)}
.honor-row:last-child{border:none}
.honor-row.me{background:var(--gold-light);border-radius:10px;padding:11px 10px;margin:0 -4px}
.honor-rank{font-size:1.1rem;min-width:30px;text-align:center}
.honor-name{flex:1;font-size:.88rem;font-weight:600;color:var(--text-secondary)}
.honor-name.me{color:var(--gold-dark);font-weight:800}
.honor-score{font-size:.9rem;font-weight:800;color:var(--green-dark)}

/* ── REVIEW ───────────────────────────────────────── */
.review-done-msg{
  background:var(--green-light);border-radius:var(--radius);
  padding:16px;text-align:center;color:var(--green-dark);
  font-weight:700;font-size:.88rem;border:1px solid rgba(76,175,125,.2);
}
.review-textarea{
  width:100%;padding:12px 14px;border:1.5px solid var(--border);
  border-radius:var(--radius-sm);font-size:.88rem;font-family:inherit;
  resize:vertical;min-height:90px;direction:rtl;outline:none;
  background:var(--surface2);color:var(--text-primary);transition:border .2s;
}
.review-textarea:focus{border-color:var(--gold);background:var(--surface);box-shadow:0 0 0 3px rgba(201,168,76,.1)}

/* ── BUTTONS ──────────────────────────────────────── */
.btn-primary{
  width:100%;padding:14px;
  background:linear-gradient(135deg,var(--text-primary) 0%,#263647 100%);
  color:#fff;border:none;border-radius:var(--radius-sm);
  font-size:.92rem;font-weight:700;cursor:pointer;font-family:inherit;margin-top:10px;
  transition:.2s;letter-spacing:.02em;
}
.btn-primary:hover{opacity:.9;transform:translateY(-1px);box-shadow:0 4px 12px rgba(28,43,58,.3)}
.btn-primary:active{transform:translateY(0)}
.btn-primary:disabled{background:#9ca3af;cursor:not-allowed;transform:none;box-shadow:none}
.btn-green{background:linear-gradient(135deg,var(--green) 0%,var(--green-dark) 100%) !important}
.btn-whatsapp{
  background:#25D366;color:#fff;border:none;border-radius:var(--radius-sm);
  padding:13px;font-size:.92rem;font-weight:700;cursor:pointer;
  font-family:inherit;width:100%;margin-bottom:10px;transition:.2s;display:block;
}
.btn-whatsapp:hover{background:#1ebe57;transform:translateY(-1px)}

/* ── SKELETON LOADERS ─────────────────────────────── */
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
.skel{
  border-radius:8px;
  background:linear-gradient(90deg,#E8ECF0 25%,#F2F4F7 50%,#E8ECF0 75%);
  background-size:200% 100%;
  animation:shimmer 1.4s ease infinite;
}
.skel-line{height:14px;margin-bottom:8px}.skel-line:last-child{margin:0;width:60%}
.skel-box{height:80px;border-radius:var(--radius)}
.skel-stat{height:70px;border-radius:var(--radius)}

/* ── EMPTY STATES ─────────────────────────────────── */
.empty-state{text-align:center;padding:32px 20px}
.empty-icon{font-size:2.5rem;margin-bottom:10px;display:block;opacity:.5}
.empty-text{font-size:.85rem;color:var(--text-muted);line-height:1.6}

/* ── LEGACY COMPAT (old class names used in JS) ────── */
.loading{text-align:center;color:var(--text-muted);padding:20px;font-size:.85rem}
.empty{text-align:center;color:var(--text-muted);padding:20px;font-size:.82rem}
.plan-day{border-radius:var(--radius);border:1.5px solid var(--border);margin-bottom:10px;overflow:hidden;background:var(--surface)}
.plan-day.today{border-color:var(--gold);box-shadow:0 0 0 3px rgba(201,168,76,.12)}
.plan-day-header{padding:12px 16px;display:flex;justify-content:space-between;align-items:center;background:var(--surface2);cursor:pointer;user-select:none}
.plan-day.today .plan-day-header{background:var(--gold-light)}
.plan-day-header .dlabel{font-size:.88rem;font-weight:800;color:var(--text-primary)}
.plan-day.today .plan-day-header .dlabel{color:var(--gold-dark)}
.plan-day-header .ddate{font-size:.72rem;color:var(--text-muted);margin-top:2px}
.today-badge{background:var(--gold);color:#fff;font-size:.6rem;font-weight:700;padding:2px 8px;border-radius:20px;margin-right:6px}
.plan-day-body{padding:12px 16px;display:none}
.plan-day.open .plan-day-body,.plan-day.today .plan-day-body{display:block}
.task-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--border)}
.task-row:last-child{border:none}
.task-icon-btn{width:38px;height:38px;border-radius:50%;border:2px solid var(--border);background:var(--surface);display:flex;align-items:center;justify-content:center;font-size:1rem;cursor:pointer;transition:all .2s;flex-shrink:0}
.task-icon-btn.done{background:var(--green);border-color:var(--green-dark);color:#fff}
.task-label{flex:1;font-size:.85rem;color:var(--text-secondary)}
.task-label.done{color:var(--text-muted);text-decoration:line-through}
.task-type-badge{font-size:.68rem;font-weight:700;padding:3px 9px;border-radius:12px;white-space:nowrap;flex-shrink:0}
.badge-memorize{background:var(--blue-light);color:#1D5FA6}
.badge-repeat{background:var(--green-light);color:var(--green-dark)}
.badge-link{background:var(--gold-light);color:var(--gold-dark)}
.badge-review{background:var(--red-light);color:#B03030}

/* ── TOAST ────────────────────────────────────────── */
.toast-wrap{
  position:fixed;top:70px;left:50%;transform:translateX(-50%);
  z-index:9999;pointer-events:none;display:flex;flex-direction:column;
  gap:8px;align-items:center;
}
@keyframes toastIn{from{opacity:0;transform:translateY(-8px) scale(.95)}to{opacity:1;transform:translateY(0) scale(1)}}
.toast{
  padding:11px 24px;border-radius:var(--radius);
  font-size:.85rem;font-weight:700;color:#fff;
  box-shadow:var(--shadow-lg);animation:toastIn .25s ease;
  white-space:nowrap;backdrop-filter:blur(4px);
}
.toast.success{background:linear-gradient(135deg,var(--green),var(--green-dark))}
.toast.error{background:linear-gradient(135deg,var(--red),#C03030)}

/* ── RESPONSIVE ───────────────────────────────────── */
@media(min-width:480px){
  .stats-grid{grid-template-columns:1fr 1fr 1fr}
}
@media(min-width:680px){
  .main{padding:20px 24px}
  .grad-banner{padding:28px 24px}
}
</style>
</head>
<body>

<!-- TOPBAR -->
<div class="topbar">
  <span class="topbar-logo">حفّاظ</span>
  <span class="topbar-name" id="studentNameTop">…</span>
  <a href="../profile.html" class="topbar-profile" title="الملف الشخصي">👤</a>
  <button class="topbar-logout" onclick="logout()">
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
    خروج
  </button>
</div>

<!-- BOTTOM NAV -->
<nav class="bottom-nav">
  <button class="nav-btn active" id="nb-study" onclick="showView('study')">
    <svg viewBox="0 0 24 24"><path d="M2 3h6a4 4 0 014 4v14a3 3 0 00-3-3H2z"/><path d="M22 3h-6a4 4 0 00-4 4v14a3 3 0 013-3h7z"/></svg>
    خطتي
  </button>
  <button class="nav-btn" id="nb-achieve" onclick="showView('achieve')">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="6"/><path d="M15.477 12.89L17 22l-5-3-5 3 1.523-9.11"/></svg>
    منجزاتي
  </button>
  <button class="nav-btn" id="nb-sessions" onclick="showView('sessions')">
    <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
    الجلسات
  </button>

<script>
const SUPABASE_URL = 'https://aeonokdakdvqgiisfhwv.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFlb25va2Rha2R2cWdpaXNmaHd2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQzMDQ1MDUsImV4cCI6MjA5OTg4MDUwNX0.g1mtt9GZRod2V_Fbe1qXQhv7Hf_LVfx-IvItth9PCgI';

const client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
  auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true, storage: localStorage, storageKey: 'huffaz-auth' }
});

let currentUser = null;
let studentData = null;
let planData = [];
let studyPlanDays = [];
let studyPlanInfo = null;
let spChecked = {};
const todayStr = new Date().toISOString().slice(0, 10);
const WEEK_DAYS = ['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];

async function init() {
  const { data: { session } } = await client.auth.getSession();
  if (!session) { location.href = '../login.html'; return; }
  const { data: userData } = await client.from('users').select('name, role').eq('id', session.user.id).single();
  if (!userData || userData.role !== 'student') { location.href = '../login.html'; return; }
  currentUser = session.user;
  document.getElementById('studentNameTop').textContent = userData.name || session.user.email;
  await loadStudentData();
  await loadSpProgress();
  await Promise.all([loadStudyPlan(), loadStats(), loadSessions(), loadHonor(), loadExams(), checkDailyReview()]);
}

async function loadStudentData() {
  const { data } = await client.from('students')
    .select('id, memorized_hadiths, program_id, current_plan_id, programs(total_hadiths)')
    .eq('user_id', currentUser.id)
    .single();
  if (data) studentData = data;
}

/* ========== SP PROGRESS (persist checkboxes) ========== */
async function loadSpProgress() {
  if (!studentData) return;
  const { data } = await client.from('student_plan_progress')
    .select('plan_day_id, task_key, completed')
    .eq('student_id', studentData.id);
  spChecked = {};
  (data || []).forEach(r => {
    if (r.completed) spChecked[r.plan_day_id + '_' + r.task_key] = true;
  });
}

async function saveSpProgress(dayId, taskKey, completed) {
  if (!studentData) return;
  await client.from('student_plan_progress').upsert(
    { student_id: studentData.id, plan_day_id: dayId, task_key: taskKey, completed, completed_at: new Date().toISOString() },
    { onConflict: 'student_id,plan_day_id,task_key' }
  );
}

/* ========== STUDY PLAN ========== */
async function loadStudyPlan() {
  const container = document.getElementById('studyPlanContent');
  if (!studentData?.current_plan_id) {
    container.innerHTML = `
      <div class="no-plan-msg">
        <span class="no-plan-icon">📚</span>
        <div class="no-plan-title">لم يتم تعيين خطة علمية بعد</div>
        <div class="no-plan-sub">تواصل مع المشرف لتعيين خطتك الدراسية</div>
      </div>`;
    return;
  }

  const [planRes, daysRes] = await Promise.all([
    client.from('study_plans').select('*').eq('id', studentData.current_plan_id).single(),
    client.from('study_plan_days').select('*').eq('plan_id', studentData.current_plan_id).order('day_number')
  ]);

  if (planRes.error || !planRes.data) {
    container.innerHTML = '<div class="empty">خطأ في تحميل الخطة</div>';
    return;
  }

  studyPlanInfo = planRes.data;
  studyPlanDays = daysRes.data || [];

  renderStudyPlan();
  updateGradDateFromStudyPlan();
}

function updateGradDateFromStudyPlan() {
  const total = studyPlanDays.length;
  const doneDays = studyPlanDays.filter(d => isSpDayDone(d)).length;
  const remaining = total - doneDays;

  const grad = new Date();
  grad.setDate(grad.getDate() + remaining);
  const gradDateStr = grad.toLocaleDateString('ar-SA', { year: 'numeric', month: 'long', day: 'numeric' });
  const gradDayStr = WEEK_DAYS[grad.getDay()];
  const el = document.getElementById('gradDate');
  const el2 = document.getElementById('gradDay');
  if (el) el.textContent = gradDateStr;
  if (el2) el2.textContent = gradDayStr + (remaining > 0 ? ' — بعد ' + remaining + ' يوم' : ' — اليوم!');

  updatePlanProgressBar(doneDays, total);
}

function updatePlanProgressBar(done, total) {
  const card = document.getElementById('planProgressCard');
  if (!total) { if (card) card.style.display = 'none'; return; }
  if (card) card.style.display = 'block';

  let totalTasks = 0, doneTasks = 0;
  studyPlanDays.forEach(d => {
    const tasks = getSpTasks(d);
    totalTasks += tasks.length;
    tasks.forEach(t => { if (spChecked[d.id + '_' + t.key]) doneTasks++; });
  });
  const taskPct = totalTasks ? Math.round((doneTasks / totalTasks) * 100) : 0;

  const lbl = document.getElementById('planProgressLabel');
  const pctEl = document.getElementById('planProgressPct');
  const bar = document.getElementById('planProgressBar');
  if (lbl) lbl.textContent = done + ' / ' + total + ' يوم مكتمل (' + doneTasks + '/' + totalTasks + ' مهمة)';
  if (pctEl) pctEl.textContent = taskPct + '%';
  setTimeout(() => { if (bar) bar.style.width = taskPct + '%'; }, 100);
}

function renderStudyPlan() {
  const container = document.getElementById('studyPlanContent');
  if (!studyPlanInfo) return;

  const totalDays = studyPlanDays.length;
  const doneDays = studyPlanDays.filter(d => isSpDayDone(d)).length;

  container.innerHTML = `
    <div class="sp-banner">
      <span class="sp-banner-icon">📖</span>
      <div>
        <div class="sp-banner-title">${studyPlanInfo.plan_name}</div>
        <div class="sp-banner-sub">${studyPlanInfo.book_name}${studyPlanInfo.folder_name ? ' — ' + studyPlanInfo.folder_name : ''} &bull; ${doneDays}/${totalDays} يوم مكتمل</div>
      </div>
    </div>
    ${studyPlanDays.length ? studyPlanDays.map(d => renderSpDay(d)).join('') : '<div class="empty-state"><span class="empty-icon">📋</span><div class="empty-text">لا توجد أيام في هذه الخطة</div></div>'}
  `;
}

function isSpDayDone(day) {
  const tasks = getSpTasks(day);
  return tasks.length > 0 && tasks.every(t => spChecked[day.id + '_' + t.key]);
}

function getSpTasks(day) {
  const tasks = [];
  if (day.memo_from || day.memo_to) tasks.push({ key: 'memo', type: 'حفظ', cls: 'sp-type-memo', label: [day.memo_from, day.memo_to].filter(Boolean).join(' — ') });
  if (day.link_from || day.link_to) tasks.push({ key: 'link', type: 'ربط', cls: 'sp-type-link', label: [day.link_from, day.link_to].filter(Boolean).join(' — ') });
  if (day.review_from || day.review_to) tasks.push({ key: 'review', type: 'مراجعة', cls: 'sp-type-review', label: [day.review_from, day.review_to].filter(Boolean).join(' — ') });
  return tasks;
}

function renderSpDay(day) {
  const tasks = getSpTasks(day);
  const allDone = isSpDayDone(day);
  const statusIcon = allDone ? '✅' : '⭕';

  const tasksHtml = tasks.map(t => {
    const done = !!spChecked[day.id + '_' + t.key];
    return `<div class="sp-task-row">
      <button class="sp-checkbox${done ? ' done' : ''}" onclick="toggleSpTask('${day.id}','${t.key}',this)">${done ? '✓' : '○'}</button>
      <span class="sp-task-type ${t.cls}">${t.type}</span>
      <span class="sp-task-label${done ? ' done' : ''}">${t.label}</span>
    </div>`;
  }).join('');

  return `<div class="sp-day-card${allDone ? ' sp-done' : ''}" id="spday-${day.id}">
    <div class="sp-day-header" onclick="this.parentElement.classList.toggle('sp-open')">
      <div class="sp-day-num">اليوم ${day.day_number}</div>
      <span class="sp-day-status">${statusIcon}</span>
    </div>
    <div class="sp-day-body">
      ${tasks.length ? tasksHtml : '<div class="empty" style="padding:8px">لا توجد مهام</div>'}
      ${tasks.length ? `<div class="sp-day-actions"><button class="btn-sp-copy" onclick="copySpDay(${day.day_number},'${day.id}')">📱 نسخ للواتساب</button></div>` : ''}
    </div>
  </div>`;
}

async function toggleSpTask(dayId, taskKey, btn) {
  const k = dayId + '_' + taskKey;
  spChecked[k] = !spChecked[k];
  const done = spChecked[k];
  btn.classList.toggle('done', done);
  btn.textContent = done ? '✓' : '○';
  const row = btn.closest('.sp-task-row');
  if (row) row.querySelector('.sp-task-label').classList.toggle('done', done);

  const card = document.getElementById('spday-' + dayId);
  if (card) {
    const day = studyPlanDays.find(d => d.id === dayId);
    if (day) {
      const allDone = isSpDayDone(day);
      const si = card.querySelector('.sp-day-status');
      if (si) si.textContent = allDone ? '✅' : '⭕';
      card.classList.toggle('sp-done', allDone);
    }
  }

  await saveSpProgress(dayId, taskKey, done);
  updateGradDateFromStudyPlan();
}

function copySpDay(dayNum, dayId) {
  const day = studyPlanDays.find(d => d.id === dayId);
  if (!day) return;
  const tasks = getSpTasks(day).filter(t => spChecked[dayId + '_' + t.key]);
  if (!tasks.length) { showToast('لم تُنجز أي مهمة في هذا اليوم بعد', 'error'); return; }
  const lines = [
    `📚 *منصة حفّاظ — ${studyPlanInfo?.plan_name || 'خطتي'}*`,
    `اليوم ${dayNum}`,
    ''
  ];
  tasks.forEach(t => lines.push(`${t.type === 'حفظ' ? '📖' : t.type === 'ربط' ? '🔗' : '📚'} ${t.type}: ${t.label}`));
  lines.push('', '✅ تم بحمد الله');
  const text = lines.join('\n');
  (navigator.clipboard?.writeText(text) || Promise.reject())
    .then(() => showToast('تم النسخ ✓', 'success'))
    .catch(() => {
      const ta = document.createElement('textarea');
      ta.value = text; document.body.appendChild(ta); ta.select();
      document.execCommand('copy'); ta.remove();
      showToast('تم النسخ ✓', 'success');
    });
}

/* ========== PLAN (student_plans) ========== */
async function loadPlan() {
  if (!studentData) { document.getElementById('planList').innerHTML = '<div class="empty">لا توجد خطة</div>'; updateGradDate([]); return; }
  const { data, error } = await client.from('student_plans')
    .select('*')
    .eq('student_id', studentData.id)
    .order('plan_date', { ascending: true });
  if (error || !data || !data.length) { document.getElementById('planList').innerHTML = '<div class="empty">لا توجد خطة مضافة بعد</div>'; updateGradDate([]); return; }
  planData = data;
  renderPlan(data);
  updateGradDate(data);
}

function getTaskDefs(row) {
  return [
    { key: 'memorize', type: 'حفظ', icon: '📖', cls: 'badge-memorize', value: row.memorize_task || row.memorize || '', done: !!(row.memorize_done) },
    { key: 'repeat',   type: 'تكرار', icon: '🔄', cls: 'badge-repeat',   value: row.repeat_task   || row.repeat   || '', done: !!(row.repeat_done)   },
    { key: 'link',     type: 'ربط',   icon: '🔗', cls: 'badge-link',     value: row.link_task     || row.link     || '', done: !!(row.link_done)     },
    { key: 'review',   type: 'مراجعة',icon: '📚', cls: 'badge-review',   value: row.review_task   || row.review   || '', done: !!(row.review_done)   },
  ].filter(t => t.value);
}

function renderPlan(data) {
  const container = document.getElementById('planList');
  container.innerHTML = '';
  data.forEach(row => {
    const isToday = row.plan_date === todayStr;
    const d = new Date(row.plan_date + 'T00:00:00');
    const dayName = WEEK_DAYS[d.getDay()];
    const dateFormatted = d.toLocaleDateString('ar-SA', { month: 'short', day: 'numeric' });
    const tasks = getTaskDefs(row);
    const allDone = tasks.length > 0 && tasks.every(t => t.done);
    const statusIcon = allDone ? '✅' : (isToday ? '🔵' : '⭕');
    const div = document.createElement('div');
    div.className = 'plan-day' + (isToday ? ' today' : '');
    div.id = 'pday-' + row.id;
    div.innerHTML = `
      <div class="plan-day-header" onclick="this.parentElement.classList.toggle('open')">
        <div>
          <div class="dlabel">${dayName} — ${dateFormatted}${isToday ? ' <span class="today-badge">اليوم</span>' : ''}</div>
          <div class="ddate">${row.plan_date || ''}</div>
        </div>
        <span style="font-size:1.1rem">${statusIcon}</span>
      </div>
      <div class="plan-day-body">
        ${tasks.length ? tasks.map(t => `
          <div class="task-row" id="tr-${row.id}-${t.key}">
            <button class="task-icon-btn${t.done ? ' done' : ''}" onclick="toggleTask('${row.id}','${t.key}',this)">${t.done ? '✓' : t.icon}</button>
            <span class="task-type-badge ${t.cls}">${t.type}</span>
            <span class="task-label${t.done ? ' done' : ''}">${t.value}</span>
          </div>
        `).join('') : '<div class="empty" style="padding:10px">لا توجد مهام</div>'}
      </div>
    `;
    container.appendChild(div);
  });
}

async function toggleTask(planId, taskKey, btn) {
  const isDone = btn.classList.contains('done');
  const newVal = !isDone;
  const updateObj = {};
  updateObj[taskKey + '_done'] = newVal;
  const { error } = await client.from('student_plans').update(updateObj).eq('id', planId);
  if (error) { showToast('خطأ في الحفظ', 'error'); return; }
  btn.classList.toggle('done', newVal);
  btn.textContent = newVal ? '✓' : ({ memorize:'📖', repeat:'🔄', link:'🔗', review:'📚' }[taskKey] || '○');
  const row = btn.closest('.task-row');
  if (row) row.querySelector('.task-label').classList.toggle('done', newVal);
  const planRow = planData.find(r => String(r.id) === String(planId));
  if (planRow) planRow[taskKey + '_done'] = newVal;
  const dayEl = document.getElementById('pday-' + planId);
  if (dayEl) {
    const tasks = getTaskDefs(planRow || {});
    const allDone = tasks.length > 0 && tasks.every(t => t.done);
    const si = dayEl.querySelector('.plan-day-header span:last-child');
    if (si) si.textContent = allDone ? '✅' : (planRow?.plan_date === todayStr ? '🔵' : '⭕');
  }
  updateGradDate(planData);
  showToast(newVal ? 'تم تسجيل الإنجاز ✓' : 'تم إلغاء الإنجاز', newVal ? 'success' : 'error');
}

function updateGradDate(data) {
  let remaining = 0;
  data.forEach(row => {
    const tasks = getTaskDefs(row);
    if (tasks.length > 0 && !tasks.every(t => t.done)) remaining++;
  });
  const grad = new Date();
  grad.setDate(grad.getDate() + remaining);
  const gradDateStr = grad.toLocaleDateString('ar-SA', { year: 'numeric', month: 'long', day: 'numeric' });
  const gradDayStr = WEEK_DAYS[grad.getDay()];
  document.getElementById('gradDate').textContent = gradDateStr;
  document.getElementById('gradDay').textContent = gradDayStr + (remaining > 0 ? ' — بعد ' + remaining + ' يوم' : ' — اليوم!');
}

/* ========== STATS ========== */
async function loadStats() {
  const grid = document.getElementById('statsGrid');
  if (!studentData) { grid.innerHTML = '<div class="empty" style="grid-column:span 2">لا توجد بيانات</div>'; return; }
  const { data: sessions } = await client.from('recitation_sessions')
    .select('hadith_to, hadith_from, score, linking_to, linking_from, date')
    .eq('student_id', studentData.id)
    .order('date', { ascending: false });
  const arr = sessions || [];
  const cnt = arr.length;
  const lastH = arr[0]?.hadith_to || 0;
  const memorized = studentData.memorized_hadiths || 0;
  const totalH = studentData.programs?.total_hadiths || 0;
  const avgScore = cnt ? (arr.reduce((s, r) => s + (parseFloat(r.score) || 0), 0) / cnt).toFixed(2) : '—';
  const totalLink = arr.reduce((s, r) => s + Math.max(0, (r.linking_to || 0) - (r.linking_from || 0) + 1), 0);
  const gap = Math.max(0, memorized - lastH);
  const pct = totalH ? Math.min(100, Math.round((lastH / totalH) * 100)) : 0;
  grid.innerHTML = `
    <div class="stat-box"><div class="stat-num">${lastH || '—'}</div><div class="stat-lbl">أحاديث مسمّعة</div></div>
    <div class="stat-box"><div class="stat-num">${cnt}</div><div class="stat-lbl">عدد الجلسات</div></div>
    <div class="stat-box"><div class="stat-num">${avgScore}</div><div class="stat-lbl">متوسط التقييم / 10</div></div>
    <div class="stat-box"><div class="stat-num">${memorized}</div><div class="stat-lbl">أحاديث محفوظة</div></div>
    <div class="stat-box"><div class="stat-num">${totalLink}</div><div class="stat-lbl">صفحات الربط</div></div>
    <div class="stat-box"><div class="stat-num">${gap}</div><div class="stat-lbl">فرق الحفظ والتسميع</div></div>
  `;
  if (totalH > 0) {
    document.getElementById('progressSection').style.display = 'block';
    document.getElementById('progressPct').textContent = pct + '%';
    setTimeout(() => { document.getElementById('progressBar').style.width = pct + '%'; }, 100);
  }
}

/* ========== DAILY REVIEW ========== */
async function checkDailyReview() {
  if (!studentData) return;
  const { data } = await client.from('daily_reviews')
    .select('id, teacher_logged, review_text')
    .eq('student_id', studentData.id)
    .eq('review_date', todayStr)
    .single();
  if (data) {
    if (data.teacher_logged) {
      document.getElementById('reviewSection').innerHTML = '<div class="review-done-msg">✅ تم تسجيل مراجعة اليوم من قِبل المعلم</div>';
    } else if (data.review_text) {
      document.getElementById('reviewText').value = data.review_text;
      document.getElementById('reviewBtn').textContent = 'تحديث المراجعة';
    }
  }
}

async function submitReview() {
  if (!studentData) return;
  const text = document.getElementById('reviewText').value.trim();
  if (!text) { showToast('اكتب مراجعتك أولاً', 'error'); return; }
  const btn = document.getElementById('reviewBtn');
  btn.disabled = true; btn.textContent = 'جاري الحفظ…';
  const { error } = await client.from('daily_reviews').upsert(
    { student_id: studentData.id, review_date: todayStr, review_text: text, teacher_logged: false },
    { onConflict: 'student_id,review_date' }
  );
  btn.disabled = false; btn.textContent = 'تحديث المراجعة';
  if (error) { showToast('خطأ: ' + error.message, 'error'); return; }
  showToast('تم تسجيل المراجعة ✓', 'success');
}

/* ========== SESSIONS ========== */
async function loadSessions() {
  const list = document.getElementById('sessionsList');
  if (!studentData) { list.innerHTML = '<div class="empty">لا توجد بيانات</div>'; return; }
  const { data, error } = await client.from('recitation_sessions')
    .select('id, date, hadith_from, hadith_to, score, notes')
    .eq('student_id', studentData.id)
    .order('date', { ascending: false });
  if (error || !data || !data.length) { list.innerHTML = '<div class="empty-state"><span class="empty-icon">🎙️</span><div class="empty-text">لا توجد جلسات بعد</div></div>'; return; }
  list.innerHTML = data.map(s => {
    const score = parseFloat(s.score);
    const cls = score >= 8.5 ? 'green' : score >= 7 ? 'yellow' : 'red';
    return `<div class="session-row">
      <div class="session-top">
        <span class="session-date">${s.date || '—'}</span>
        <span class="score-badge ${cls}">${isNaN(score) ? '—' : score.toFixed(2)}/10</span>
      </div>
      <div class="session-range">الأحاديث ${s.hadith_from || '—'} – ${s.hadith_to || '—'}</div>
      ${s.notes ? `<div class="session-note">${s.notes}</div>` : ''}
    </div>`;
  }).join('');
}

/* ========== EXAMS ========== */
async function loadExams() {
  const list = document.getElementById('examsList');
  if (!studentData) { list.innerHTML = '<div class="empty">لا توجد بيانات</div>'; return; }
  const { data, error } = await client.from('periodic_exams')
    .select('*')
    .eq('student_id', studentData.id)
    .order('exam_date', { ascending: false });
  if (error || !data || !data.length) { list.innerHTML = '<div class="empty-state"><span class="empty-icon">📋</span><div class="empty-text">لا توجد اختبارات بعد</div></div>'; return; }
  list.innerHTML = data.map(e => {
    const score = parseFloat(e.score);
    const color = score >= 8.5 ? 'var(--green-dark)' : score >= 7 ? '#92640A' : 'var(--red)';
    return `<div class="exam-row">
      <div>
        <div class="exam-label">${e.title || e.exam_type || 'اختبار'}</div>
        <div class="exam-date">${e.exam_date || ''}</div>
      </div>
      <div class="exam-score" style="color:${color}">${isNaN(score) ? '—' : score.toFixed(2)}/10</div>
    </div>`;
  }).join('');
}

/* ========== HONOR BOARD ========== */
async function loadHonor() {
  const list = document.getElementById('honorList');
  const { data, error } = await client.from('recitation_sessions')
    .select('student_id, score, students(users(name))');
  if (error || !data || !data.length) { list.innerHTML = '<div class="empty-state"><span class="empty-icon">🌟</span><div class="empty-text">لا توجد بيانات بعد</div></div>'; return; }
  const map = {};
  data.forEach(r => {
    const id = r.student_id;
    if (!map[id]) map[id] = { name: r.students?.users?.name || 'طالب', scores: [] };
    const s = parseFloat(r.score);
    if (!isNaN(s)) map[id].scores.push(s);
  });
  const ranked = Object.entries(map)
    .filter(([, v]) => v.scores.length)
    .map(([id, v]) => ({ id, name: v.name, avg: v.scores.reduce((a, b) => a + b, 0) / v.scores.length }))
    .sort((a, b) => b.avg - a.avg)
    .slice(0, 10);
  const medals = ['🥇','🥈','🥉'];
  const myStudentId = studentData?.id;
  list.innerHTML = ranked.map((s, i) => {
    const isMe = String(s.id) === String(myStudentId);
    return `<div class="honor-row${isMe ? ' me' : ''}">
      <span class="honor-rank">${medals[i] || (i + 1)}</span>
      <span class="honor-name${isMe ? ' me' : ''}">${s.name}${isMe ? ' (أنت)' : ''}</span>
      <span class="honor-score">${s.avg.toFixed(2)}</span>
    </div>`;
  }).join('');
}

/* ========== WHATSAPP ========== */
function copyToWhatsApp() {
  const todayRow = planData.find(r => r.plan_date === todayStr);
  if (!todayRow) { showToast('لا توجد خطة لليوم', 'error'); return; }
  const tasks = getTaskDefs(todayRow).filter(t => t.done);
  if (!tasks.length) { showToast('لم تنجز أي واجب اليوم بعد', 'error'); return; }
  const d = new Date(todayStr + 'T00:00:00');
  const dayName = WEEK_DAYS[d.getDay()];
  const dateFormatted = d.toLocaleDateString('ar-SA', { year: 'numeric', month: 'long', day: 'numeric' });
  const lines = ['📚 *منصة حفّاظ*', `${dayName} — ${dateFormatted}`, ''];
  tasks.forEach(t => lines.push(`${t.icon} ${t.type}: ${t.value}`));
  lines.push('', '✅ تم الإنجاز بحمد الله');
  const text = lines.join('\n');
  (navigator.clipboard?.writeText(text) || Promise.reject()).then(() => {
    showToast('تم النسخ — الصق في الواتساب ✓', 'success');
  }).catch(() => {
    const ta = document.createElement('textarea');
    ta.value = text; document.body.appendChild(ta); ta.select();
    document.execCommand('copy'); ta.remove();
    showToast('تم النسخ ✓', 'success');
  });
}

/* ========== NAV ========== */
function showView(name) {
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('view-' + name).classList.add('active');
  const nb = document.getElementById('nb-' + name);
  if (nb) nb.classList.add('active');
}

/* ========== LOGOUT ========== */
async function logout() {
  await client.auth.signOut();
  sessionStorage.removeItem('huffaz-auth');
  location.href = '../login.html';
}

/* ========== TOAST ========== */
function showToast(msg, type) {
  const w = document.getElementById('toastWrap');
  const t = document.createElement('div');
  t.className = 'toast ' + (type || 'success');
  t.textContent = msg;
  w.appendChild(t);
  setTimeout(() => t.remove(), 3000);
}

init();
